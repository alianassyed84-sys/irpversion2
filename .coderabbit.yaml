# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be concise, actionable, and prioritize security, runtime performance, WCAG accessibility, and type safety."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.pytest_cache/**"
    - "!**/*.lock"
    - "!**/dataset_*.json"

  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
